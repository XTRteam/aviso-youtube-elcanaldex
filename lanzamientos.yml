name: Aviso de lanzamientos

on:
  schedule:
    - cron: "7 9 * * *"   # cada día sobre las 10:00 (hora de España en invierno)
  workflow_dispatch:       # botón para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: aviso-lanzamientos
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar lanzamientos de hoy
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_LANZAMIENTOS: ${{ secrets.DISCORD_WEBHOOK_LANZAMIENTOS }}
          MENCION: ${{ vars.MENCION_LANZAMIENTOS }}
          MIN_POPULARIDAD: ${{ vars.MIN_POPULARIDAD }}
          MAX_JUEGOS: ${{ vars.MAX_JUEGOS }}
        run: python3 aviso_lanzamientos.py

      - name: Guardar juegos ya avisados
        if: always()
        run: |
          if [ -n "$(git status --porcelain lanzamientos_vistos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lanzamientos_vistos.json
            git commit -m "Actualizar lanzamientos avisados"
            git pull --rebase
            git push
          fi
