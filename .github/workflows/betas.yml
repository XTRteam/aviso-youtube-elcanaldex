name: Aviso de betas

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: aviso-betas
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar betas nuevas
        env:
          DISCORD_WEBHOOK_BETAS: ${{ secrets.DISCORD_WEBHOOK_BETAS }}
          MENCION: ${{ vars.MENCION_BETAS }}
          PLATAFORMAS: ${{ vars.PLATAFORMAS_BETAS }}
        run: python3 aviso_betas.py

      - name: Guardar betas ya avisadas
        if: always()
        run: |
          if [ -n "$(git status --porcelain betas_vistas.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add betas_vistas.json
            git commit -m "Actualizar betas avisadas"
            git pull --rebase
            git push
          fi
