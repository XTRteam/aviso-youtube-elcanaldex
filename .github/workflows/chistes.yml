name: Chiste gamer

on:
  schedule:
    - cron: "23 5,11,17,23 * * *"   # cada 6 horas (06:23, 12:23, 18:23 y 00:23 en España en invierno)
  workflow_dispatch:                 # botón para publicar uno ya

permissions:
  contents: write

concurrency:
  group: aviso-chistes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publicar un chiste
        env:
          DISCORD_WEBHOOK_CHISTES: ${{ secrets.DISCORD_WEBHOOK_CHISTES }}
        run: python3 aviso_chistes.py

      - name: Guardar chistes ya publicados
        if: always()
        run: |
          if [ -n "$(git status --porcelain chistes_usados.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add chistes_usados.json
            git commit -m "Actualizar chistes publicados"
            git pull --rebase
            git push
          fi
