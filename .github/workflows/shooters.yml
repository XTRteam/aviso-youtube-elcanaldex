name: Aviso de noticias de shooters

on:
  schedule:
    - cron: "47 * * * *"   # cada hora
  workflow_dispatch:        # botón para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: aviso-shooters
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar noticias de shooters
        env:
          DISCORD_WEBHOOK_NOTICIAS: ${{ secrets.DISCORD_WEBHOOK_SHOOTERS }}
          FUENTES: ${{ vars.FUENTES }}
          PALABRAS_CLAVE: ${{ vars.PALABRAS_SHOOTERS }}
          MAX_NOTICIAS: ${{ vars.MAX_SHOOTERS }}
          MENCION: ${{ vars.MENCION_SHOOTERS }}
          ARCHIVO_ESTADO: shooters_vistas.json
        run: python3 aviso_noticias.py

      - name: Guardar noticias ya avisadas
        if: always()
        run: |
          if [ -n "$(git status --porcelain shooters_vistas.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shooters_vistas.json
            git commit -m "Actualizar noticias de shooters avisadas"
            git pull --rebase
            git push
          fi
