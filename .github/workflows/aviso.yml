name: Aviso de vídeos nuevos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aviso-youtube
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar vídeos nuevos
        env:
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MENSAJE: ${{ vars.MENSAJE }}
        run: python3 aviso_youtube.py

      - name: Guardar vídeos ya avisados
        if: always()
        run: |
          if [ -n "$(git status --porcelain videos_vistos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos_vistos.json
            git commit -m "Actualizar vídeos avisados"
            git push
          fi
